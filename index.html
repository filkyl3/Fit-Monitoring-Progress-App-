<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carlo Fit">
<meta name="theme-color" content="#0a0a0a">
<title>Carlo Fit</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0a0a0a;--s1:#111111;--s2:#181818;--s3:#202020;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --accent:#b6f03c;--accent2:#8fc42a;--accent-bg:rgba(182,240,60,0.1);
  --text:#f0f0f0;--muted:#888;--dim:#444;
  --d1:#4da6ff;--d1bg:rgba(77,166,255,0.12);
  --d2:#ff6b47;--d2bg:rgba(255,107,71,0.12);
  --d3:#c77dff;--d3bg:rgba(199,125,255,0.12);
  --green:#34c759;--red:#ff3b30;--gold:#ffd60a;--orange:#ff9f0a;
  --safe:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease:cubic-bezier(0.25,0.46,0.45,0.94);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;
  background:var(--bg);color:var(--text);
  overscroll-behavior:none;
}

/* ── ROOT LAYOUT ── */
#root{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  padding-top:var(--safe-top);
}

/* ── HEADER ── */
.hdr{
  padding:16px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  position:relative;
  z-index:10;
}
.hdr-title{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.hdr-title span{color:var(--accent)}
.hdr-sub{font-size:13px;color:var(--muted);margin-top:1px}
.hdr-badge{
  background:var(--accent-bg);color:var(--accent);
  font-size:12px;font-weight:700;
  padding:4px 12px;border-radius:20px;
  border:1px solid rgba(182,240,60,0.2);
}

/* ── PAGES ── */
#pages{
  flex:1;overflow:hidden;position:relative;
}
.page{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:0 0 calc(80px + var(--safe)) 0;
  opacity:0;transform:translateX(30px);
  transition:opacity .28s var(--ease),transform .28s var(--ease);
  pointer-events:none;
}
.page.active{
  opacity:1;transform:translateX(0);
  pointer-events:all;
}
.page.exit{
  opacity:0;transform:translateX(-30px);
}

/* ── NAV ── */
.nav{
  display:flex;
  background:rgba(15,15,15,0.95);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe);
  flex-shrink:0;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:10px 4px 8px;
  background:none;border:none;color:var(--dim);
  cursor:pointer;font-family:inherit;font-size:10px;font-weight:500;
  transition:color .2s;
  position:relative;
}
.nb.active{color:var(--accent)}
.nb-icon{font-size:23px;line-height:1;transition:transform .2s var(--spring)}
.nb.active .nb-icon{transform:scale(1.15)}
.nb-dot{
  position:absolute;top:8px;right:calc(50% - 16px);
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  display:none;
}

/* ── SECTION ── */
.sec{padding:0 16px;margin-top:20px}
.sec:first-child{margin-top:12px}
.sec-title{
  font-size:11px;font-weight:700;
  color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;
  margin-bottom:12px;padding-left:2px;
}

/* ── DAY PILLS ── */
.day-pills{
  display:flex;gap:8px;
  overflow-x:auto;padding:0 16px 4px;
  scrollbar-width:none;
  margin-top:16px;
}
.day-pills::-webkit-scrollbar{display:none}
.day-pill{
  flex-shrink:0;
  padding:10px 18px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--s1);
  cursor:pointer;
  transition:all .2s var(--spring);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.day-pill:active{transform:scale(.95)}
.day-pill .dp-num{font-size:10px;color:var(--muted);font-weight:600}
.day-pill .dp-name{font-size:14px;font-weight:700;color:var(--text)}
.day-pill.d1.active{background:var(--d1bg);border-color:var(--d1);box-shadow:0 0 20px rgba(77,166,255,0.15)}
.day-pill.d1.active .dp-name{color:var(--d1)}
.day-pill.d2.active{background:var(--d2bg);border-color:var(--d2);box-shadow:0 0 20px rgba(255,107,71,0.15)}
.day-pill.d2.active .dp-name{color:var(--d2)}
.day-pill.d3.active{background:var(--d3bg);border-color:var(--d3);box-shadow:0 0 20px rgba(199,125,255,0.15)}
.day-pill.d3.active .dp-name{color:var(--d3)}

/* ── CARD ── */
.card{
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:10px;
  transition:transform .15s,box-shadow .15s;
}
.card:active{transform:scale(.99)}

/* ── EXERCISE CARD (SCHEDA MODE) ── */
.ex-scheda{
  padding:16px;
  border-bottom:1px solid var(--border);
}
.ex-scheda:last-child{border-bottom:none}
.ex-s-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ex-num{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;flex-shrink:0;
}
.ex-s-name{font-size:15px;font-weight:700;color:var(--text);flex:1}
.ex-s-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:8px;
}
.chip-sets{background:rgba(255,255,255,0.06);color:var(--text)}
.chip-reps{background:var(--accent-bg);color:var(--accent)}
.chip-rec{background:rgba(255,255,255,0.04);color:var(--muted)}
.chip-peso{background:rgba(255,210,10,0.1);color:var(--gold)}
.ex-s-note{
  font-size:12px;color:var(--muted);
  line-height:1.5;margin-top:6px;
  padding:8px 10px;
  background:rgba(255,255,255,0.03);
  border-radius:8px;
  border-left:2px solid var(--dim);
}

/* ── FINISHER SCHEDA ── */
.finisher-scheda{
  background:linear-gradient(135deg,rgba(182,240,60,0.06),rgba(182,240,60,0.02));
  border:1px solid rgba(182,240,60,0.15);
  border-radius:16px;
  padding:16px;
  margin-bottom:10px;
}
.fin-label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.fin-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px}
.fin-desc{font-size:13px;color:var(--muted);line-height:1.5}

/* ── LOG MODE ── */
.mode-toggle{
  display:flex;gap:0;
  background:var(--s2);
  border-radius:12px;padding:3px;
  margin:0 16px 16px;
}
.mode-btn{
  flex:1;padding:8px;border-radius:9px;
  border:none;background:none;
  font-family:inherit;font-size:13px;font-weight:600;
  color:var(--muted);cursor:pointer;
  transition:all .2s var(--spring);
}
.mode-btn.active{
  background:var(--s3);color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}

/* ── LOG EXERCISE ── */
.ex-log{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.ex-log:last-child{border-bottom:none}
.ex-l-name{font-size:14px;font-weight:700;margin-bottom:4px}
.ex-l-target{font-size:11px;color:var(--muted);margin-bottom:10px}
.sets-grid{display:flex;gap:8px;flex-wrap:wrap}
.set-w{display:flex;flex-direction:column;align-items:center;gap:4px}
.set-lbl{font-size:10px;color:var(--dim);font-weight:600}
.set-in{
  width:56px;height:48px;
  background:var(--s2);border:1px solid var(--border);
  border-radius:12px;color:var(--text);
  font-size:20px;font-weight:700;font-family:inherit;
  text-align:center;
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s,background .15s;
}
.set-in:focus{outline:none;border-color:var(--accent);background:rgba(182,240,60,0.05)}
.set-in.ok{border-color:rgba(182,240,60,0.4);color:var(--accent)}

/* ── FINISHER LOG ── */
.fin-log{
  background:var(--s2);
  border:1px solid rgba(182,240,60,0.15);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.fin-log-left{flex:1}
.fin-log-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:2px}
.fin-log-desc{font-size:12px;color:var(--muted)}
.fin-in{
  width:64px;height:52px;
  background:var(--s3);border:1px solid rgba(182,240,60,0.2);
  border-radius:12px;color:var(--accent);
  font-size:22px;font-weight:800;font-family:inherit;
  text-align:center;
  -webkit-appearance:none;appearance:none;
}
.fin-in:focus{outline:none;border-color:var(--accent)}

/* ── NOTE ── */
.note-in{
  width:100%;background:var(--s1);
  border:1px solid var(--border);border-radius:14px;
  color:var(--text);font-size:14px;padding:12px 14px;
  font-family:inherit;resize:none;
  -webkit-appearance:none;
}
.note-in:focus{outline:none;border-color:rgba(255,255,255,0.2)}

/* ── BTN ── */
.btn{
  display:block;width:100%;
  padding:16px;border-radius:16px;border:none;
  font-size:16px;font-weight:800;font-family:inherit;
  cursor:pointer;
  transition:transform .15s var(--spring),opacity .15s;
}
.btn:active{transform:scale(.97);opacity:.85}
.btn-accent{background:var(--accent);color:#000}
.btn-ghost{
  background:var(--s2);color:var(--text);
  border:1px solid var(--border);
  font-size:14px;padding:13px;
}
.btn-danger{
  background:rgba(255,59,48,0.1);color:var(--red);
  border:1px solid rgba(255,59,48,0.2);font-size:14px;padding:13px;
}

/* ── TOAST ── */
#toast{
  position:fixed;top:calc(var(--safe-top) + 12px);
  left:50%;transform:translateX(-50%) translateY(-120px);
  background:var(--text);color:#000;
  padding:11px 22px;border-radius:20px;
  font-size:14px;font-weight:700;
  transition:transform .35s var(--spring);
  z-index:999;white-space:nowrap;
  box-shadow:0 4px 24px rgba(0,0,0,0.4);
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── PESO ── */
.peso-hero{
  background:linear-gradient(135deg,var(--s2),var(--s1));
  border:1px solid var(--border);border-radius:20px;
  padding:20px;margin-bottom:12px;
}
.peso-row{display:flex;gap:10px;align-items:flex-start}
.peso-in-wrap{display:flex;flex-direction:column;gap:4px}
.peso-in-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.peso-in{
  width:110px;background:var(--s3);
  border:1px solid var(--border);border-radius:14px;
  color:var(--text);font-size:30px;font-weight:800;
  text-align:center;padding:12px 8px;font-family:inherit;
  -webkit-appearance:none;appearance:none;
}
.peso-in:focus{outline:none;border-color:var(--accent)}
.note-peso{
  flex:1;background:var(--s3);
  border:1px solid var(--border);border-radius:14px;
  color:var(--text);font-size:14px;padding:12px;
  font-family:inherit;align-self:flex-end;
  -webkit-appearance:none;
}
.note-peso:focus{outline:none;border-color:rgba(255,255,255,0.2)}

/* ── PESO LIST ── */
.peso-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;
  background:var(--s1);border:1px solid var(--border);
  border-radius:14px;margin-bottom:8px;
}
.pi-date{font-size:12px;color:var(--muted)}
.pi-val{font-size:22px;font-weight:800}
.pi-delta{font-size:13px;font-weight:700}
.pi-note{font-size:11px;color:var(--muted);margin-top:2px}
.del-x{
  background:none;border:none;color:var(--dim);
  font-size:20px;cursor:pointer;padding:4px 8px;
  border-radius:10px;transition:all .15s;
}
.del-x:active{background:rgba(255,59,48,0.1);color:var(--red)}

/* ── STORICO ── */
.hist-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;
}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.hist-date{font-size:12px;color:var(--muted)}
.hist-badge{
  font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:10px;
}
.hist-exs{font-size:12px;color:var(--muted);line-height:1.7}
.hist-fin{font-size:12px;font-weight:700;color:var(--accent);margin-top:4px}
.hist-note{font-size:12px;color:var(--dim);font-style:italic;margin-top:3px}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:18px;padding:16px;
}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat-val{font-size:32px;font-weight:800;line-height:1;margin-bottom:3px}
.stat-sub{font-size:11px;color:var(--dim)}
.prog-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:18px;padding:16px;margin-bottom:10px;
}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.prog-bg{background:var(--s3);border-radius:99px;height:10px;margin-bottom:8px;overflow:hidden}
.prog-fill{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .8s var(--spring)}
.prog-pct{font-size:26px;font-weight:800;color:var(--accent)}
.prog-desc{font-size:12px;color:var(--muted);margin-top:2px}

/* ── INFO ── */
.info-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;
  margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;
}
.ic-left .ic-label{font-size:14px;font-weight:600}
.ic-left .ic-sub{font-size:12px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px}
.badge-acc{background:var(--accent-bg);color:var(--accent)}
.badge-mut{background:rgba(255,255,255,0.06);color:var(--muted)}
.rule-row{
  font-size:13px;padding:12px 14px;
  background:var(--s1);border:1px solid var(--border);
  border-radius:12px;margin-bottom:6px;
  line-height:1.4;color:var(--muted);
}

/* ── EMPTY ── */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-ico{font-size:44px;margin-bottom:14px;display:block}
.empty-txt{font-size:14px;line-height:1.6}

/* scrollbar hide */
.page::-webkit-scrollbar{display:none}

/* number input spin hide */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
</style>
</head>
<body>
<div id="root">

  <!-- HEADER -->
  <div class="hdr" id="main-hdr">
    <div>
      <div class="hdr-title">Carlo <span>Fit</span></div>
      <div class="hdr-sub" id="hdr-date"></div>
    </div>
    <div class="hdr-badge" id="hdr-badge" style="display:none"></div>
  </div>

  <!-- PAGES -->
  <div id="pages">

    <!-- ═══ SCHEDA ═══ -->
    <div class="page active" id="p-scheda">
      <div class="day-pills" id="scheda-pills"></div>
      <div id="scheda-content" style="padding:12px 16px 0"></div>
    </div>

    <!-- ═══ ALLENAMENTO ═══ -->
    <div class="page" id="p-workout">
      <div class="day-pills" id="log-pills"></div>
      <div style="padding:12px 16px 0" id="log-content"></div>
    </div>

    <!-- ═══ STORICO ═══ -->
    <div class="page" id="p-storico">
      <div style="padding:12px 16px 0" id="storico-content"></div>
    </div>

    <!-- ═══ PESO ═══ -->
    <div class="page" id="p-peso">
      <div style="padding:12px 16px 0">
        <div class="peso-hero">
          <div class="sec-title" style="margin-bottom:12px">Inserisci peso</div>
          <div class="peso-row">
            <div class="peso-in-wrap">
              <div class="peso-in-lbl">Peso (kg)</div>
              <input class="peso-in" id="in-peso" type="number" step="0.1" placeholder="63" inputmode="decimal">
            </div>
            <textarea class="note-peso" id="in-pesonote" rows="2" placeholder="Note (opzionale)..."></textarea>
          </div>
          <div style="height:12px"></div>
          <button class="btn btn-accent" onclick="savePeso()">Salva peso</button>
        </div>
        <div class="sec-title">Storico pesi</div>
        <div id="peso-list"></div>
      </div>
    </div>

    <!-- ═══ STATS ═══ -->
    <div class="page" id="p-stats">
      <div style="padding:12px 16px 0" id="stats-content"></div>
    </div>

  </div>

  <!-- NAV -->
  <nav class="nav">
    <button class="nb active" id="nb-scheda" onclick="nav('scheda')">
      <div class="nb-icon">📋</div>Scheda
    </button>
    <button class="nb" id="nb-workout" onclick="nav('workout')">
      <div class="nb-icon">💪</div>Log
    </button>
    <button class="nb" id="nb-storico" onclick="nav('storico')">
      <div class="nb-icon">🗂</div>Storico
    </button>
    <button class="nb" id="nb-peso" onclick="nav('peso')">
      <div class="nb-icon">⚖️</div>Peso
    </button>
    <button class="nb" id="nb-stats" onclick="nav('stats')">
      <div class="nb-icon">📈</div>Stats
    </button>
  </nav>
</div>
<div id="toast"></div>

<script>
/* ══ DATA ══ */
const PLAN = {
  1:{
    label:'Giorno 1',name:'Schiena + Bicipiti + Core',
    color:'var(--d1)',bg:'var(--d1bg)',cls:'d1',
    warmup:'Dead Hang 2×30″ · Band Pull-Apart 2×15 · Scapular Pull-up 1×8 · Push-up negativo 1×8',
    exercises:[
      {id:'pullup',name:'Pull-up presa prona',sets:4,reps:'Max 6–10',rec:'90″',peso:'—',note:'Eccentrica 3″. Petto alla sbarra. Scapole abbassate prima di tirare.'},
      {id:'chinup',name:'Chin-up presa supina',sets:3,reps:'6–8',rec:'90″',peso:'—',note:'Palmi verso di te. Eccentrica 3″. Bicipite dominante.'},
      {id:'row',name:'DB Single-Arm Row',sets:3,reps:'12/lato',rec:'75″',peso:'10 kg',note:'Massima escursione. Eccentrica 3″. Strizza la scapola in cima.'},
      {id:'facepull',name:'Band Face Pull',sets:3,reps:'15–20',rec:'60″',peso:'elastico',note:'Gomiti alti. Tirata verso il viso. Deltoide posteriore.'},
      {id:'curl',name:'DB Hammer Curl',sets:3,reps:'12',rec:'60″',peso:'8–10 kg',note:'Eccentrica 3″. Niente dondolamento. Drop set al 3° set.'},
      {id:'abwheel',name:'Ab Wheel Rollout',sets:3,reps:'10',rec:'60″',peso:'—',note:'Eccentrica 4″. Non cedere in lordosi.'},
      {id:'knee',name:'Knee to Chest sbarra',sets:3,reps:'12',rec:'45″',peso:'—',note:'Appeso, ginocchia al petto. Basso addome + grip.'},
    ],
    finisher:'AMRAP 5 min',
    finisherDesc:'5 Pull-up → 10 Leg Raise → 15 Mountain Climber',
    cooldown:'Lat stretch 45″/lato · Bicep wall stretch 30″/lato · Respirazione 60″'
  },
  2:{
    label:'Giorno 2',name:'Spalle + Petto + Tricipiti',
    color:'var(--d2)',bg:'var(--d2bg)',cls:'d2',

    exercises:[
      {id:'goblet',name:'DB Goblet Squat',sets:4,reps:'12–15',rec:'90″',peso:'10 kg',note:'Pausa isometrica 3″ in fondo — obbligatoria. Stimolo quad massimo.'},
      {id:'rdl',name:'DB Romanian Deadlift',sets:4,reps:'12',rec:'90″',peso:'10+10 kg',note:'Eccentrica 4″. Scendi fino allo stiramento dei femorali.'},

      {id:'hipthrust',name:'DB Hip Thrust (spalle su sedia)',sets:3,reps:'15',rec:'75″',peso:'10+10 kg',note:'Pausa 2″ in alto. Contrazione massima del gluteo.'},
      {id:'abwheel3',name:'Ab Wheel Rollout',sets:3,reps:'10',rec:'60″',peso:'—',note:'Eccentrica 4″. Non cedere in lordosi.'},
    ],
    finisher:'AMRAP 5 min',
    finisherDesc:'10 Squat Jump · 10 Knee to Chest sbarra · 15 Mountain Climber',
    cooldown:'Pigeon pose 60″/lato · Hamstring stretch 45″/lato · Hip flexor affondo 30″/lato'
  }
};

const RULES=[
  '✅ Pesarsi ogni lunedì mattina a stomaco vuoto',
  '✅ Carboidrati la sera nei giorni di allenamento',
  '✅ Proteine minimo 160g/giorno + 40g whey mattina',
  '✅ Creatina 5g ogni mattina — mai saltare',
  '✅ Dormi 7–7.5h — schermi off 30 min prima',
  '✅ Il finisher non si salta mai',
  '❌ No deficit calorico aggressivo (>500 kcal)',
  '❌ No allenamento con muscoli ancora doloranti',
  '❌ Non pesarti ogni giorno — solo il lunedì',
  '❌ Non cambiare il piano prima di 8 settimane',
];

let curScheda=1, curLog=1, curPage='scheda';

/* ── STORAGE ── */
const DB={
  get:(k)=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.error(e)}}
};

/* ── TOAST ── */
function toast(msg,ms=2200){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

/* ── NAV ── */
function nav(p){
  const pages=['scheda','workout','storico','peso','stats'];
  const prev=curPage;
  document.getElementById('p-'+prev)?.classList.add('exit');
  setTimeout(()=>document.getElementById('p-'+prev)?.classList.remove('exit'),300);
  pages.forEach(n=>{
    document.getElementById('p-'+n)?.classList.toggle('active',n===p);
    document.getElementById('nb-'+n)?.classList.toggle('active',n===p);
  });
  curPage=p;
  if(p==='storico')renderStorico();
  if(p==='peso')renderPesoList();
  if(p==='stats')renderStats();
  if(p==='scheda')renderScheda();
}

/* ══ SCHEDA ══ */
function renderPills(containerId, curDay, onSelect){
  const c=document.getElementById(containerId);
  c.innerHTML=Object.entries(PLAN).map(([d,day])=>`
    <div class="day-pill ${day.cls} ${parseInt(d)===curDay?'active':''}" onclick="${onSelect}(${d})">
      <div class="dp-num">${day.label}</div>
      <div class="dp-name">${day.name.split(' + ')[0]}</div>
    </div>`).join('');
}

function renderScheda(){
  renderPills('scheda-pills',curScheda,'selectScheda');
  const day=PLAN[curScheda];
  const col=day.color;
  let html=`
  <div class="sec-title" style="color:${col}">🔥 Riscaldamento (5 min)</div>
  <div class="card" style="margin-bottom:16px">
    <div style="padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.7">${day.warmup}</div>
  </div>
  <div class="sec-title" style="color:${col}">💪 Esercizi</div>
  <div class="card">`;

  day.exercises.forEach((ex,i)=>{
    html+=`<div class="ex-scheda">
      <div class="ex-s-top">
        <div class="ex-num" style="background:${day.bg};color:${col}">${i+1}</div>
        <div class="ex-s-name">${ex.name}</div>
      </div>
      <div class="ex-s-chips">
        <span class="chip chip-sets">${ex.sets} serie</span>
        <span class="chip chip-reps">${ex.reps} rip.</span>
        <span class="chip chip-rec">⏱ ${ex.rec}</span>
        ${ex.peso!=='—'?`<span class="chip chip-peso">${ex.peso}</span>`:''}
      </div>
      <div class="ex-s-note">${ex.note}</div>
    </div>`;
  });
  html+=`</div>
  <div class="sec-title" style="margin-top:16px;color:${col}">⚡ Finisher</div>
  <div class="finisher-scheda">
    <div class="fin-label">Finisher</div>
    <div class="fin-title">${day.finisher}</div>
    <div class="fin-desc">${day.finisherDesc}</div>
  </div>
  <div class="sec-title" style="color:var(--muted)">🧘 Defaticamento (2 min)</div>
  <div class="card" style="margin-bottom:0">
    <div style="padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.7">${day.cooldown}</div>
  </div>
  <div style="height:4px"></div>`;
  document.getElementById('scheda-content').innerHTML=html;
}

function selectScheda(d){curScheda=d;renderScheda()}

/* ══ LOG ══ */
function renderLog(){
  renderPills('log-pills',curLog,'selectLog');
  const day=PLAN[curLog];
  let html=`<div class="card">`;
  day.exercises.forEach(ex=>{
    const sets=Array.from({length:ex.sets},(_,i)=>i+1);
    html+=`<div class="ex-log">
      <div class="ex-l-name">${ex.name}</div>
      <div class="ex-l-target">${ex.sets} × ${ex.reps} · ${ex.rec} recupero${ex.peso!=='—'?' · '+ex.peso:''}</div>
      <div class="sets-grid">
        ${sets.map(s=>`<div class="set-w">
          <div class="set-lbl">S${s}</div>
          <input class="set-in" id="s-${ex.id}-${s}" type="number" inputmode="numeric" placeholder="—" min="0" max="99" oninput="this.classList.toggle('ok',this.value!=='')">
        </div>`).join('')}
      </div>
    </div>`;
  });
  html+=`</div>
  <div class="fin-log">
    <div class="fin-log-left">
      <div class="fin-log-title">⚡ ${day.finisher}</div>
      <div class="fin-log-desc">${day.finisherDesc}</div>
    </div>
    <input class="fin-in" id="s-finisher" type="number" inputmode="numeric" placeholder="0" min="0" max="50">
  </div>
  <textarea class="note-in" id="s-note" rows="2" placeholder="Note sessione (opzionale)..."></textarea>
  <div style="height:10px"></div>
  <button class="btn btn-accent" onclick="saveSession()">Salva sessione 💾</button>
  <div style="height:8px"></div>`;
  document.getElementById('log-content').innerHTML=html;
}

function selectLog(d){curLog=d;renderLog()}

function saveSession(){
  const day=PLAN[curLog];
  const now=new Date();
  const session={
    id:now.getTime(),
    date:now.toISOString(),
    dateStr:now.toLocaleDateString('it-IT'),
    day:curLog,dayName:day.name,
    exercises:{},
    finisher:document.getElementById('s-finisher')?.value||'',
    note:document.getElementById('s-note')?.value||''
  };
  let hasData=false;
  day.exercises.forEach(ex=>{
    const sets=[];
    for(let s=1;s<=ex.sets;s++){
      const v=document.getElementById(`s-${ex.id}-${s}`)?.value;
      if(v!==''&&v!==undefined){sets.push(parseInt(v));hasData=true;}
      else sets.push(null);
    }
    session.exercises[ex.name]=sets;
  });
  const fin=document.getElementById('s-finisher')?.value;
  if(fin)hasData=true;
  if(!hasData){toast('Inserisci almeno un risultato ⚠️');return;}
  const sessions=DB.get('sessions');
  sessions.push(session);
  DB.set('sessions',sessions);
  toast('Sessione salvata ✓');
  document.getElementById('log-content').querySelectorAll('.set-in,.fin-in,textarea').forEach(el=>{
    el.value='';el.classList.remove('ok');
  });
  updateBadge();
}

/* ══ STORICO ══ */
function renderStorico(){
  const sessions=DB.get('sessions').reverse();
  const el=document.getElementById('storico-content');
  if(!sessions.length){
    el.innerHTML=`<div class="empty"><span class="empty-ico">🗂</span><div class="empty-txt">Nessuna sessione.<br>Inizia dal Log!</div></div>`;
    return;
  }
  el.innerHTML=`<div class="sec-title">${sessions.length} sessioni totali</div>`+
  sessions.map(s=>{
    const day=PLAN[s.day];
    const exLines=Object.entries(s.exercises||{})
      .map(([name,sets])=>{
        const v=(sets||[]).filter(x=>x!==null&&x!==undefined);
        return v.length?`${name}: ${v.join(' · ')}`:''
      }).filter(Boolean).join('<br>');
    return `<div class="hist-card">
      <div class="hist-top">
        <div>
          <div class="hist-date">${s.dateStr}</div>
          <div class="hist-badge" style="background:${day?.bg||'#222'};color:${day?.color||'#888'};margin-top:4px;display:inline-block">
            Giorno ${s.day}
          </div>
        </div>
        <button class="del-x" onclick="delSession(${s.id})">×</button>
      </div>
      <div class="hist-exs">${exLines||'—'}</div>
      ${s.finisher?`<div class="hist-fin">⚡ Finisher: ${s.finisher} round</div>`:''}
      ${s.note?`<div class="hist-note">${s.note}</div>`:''}
    </div>`;
  }).join('');
}

function delSession(id){
  if(!confirm('Eliminare questa sessione?'))return;
  DB.set('sessions',DB.get('sessions').filter(s=>s.id!==id));
  renderStorico();toast('Eliminata');
}

/* ══ PESO ══ */
function savePeso(){
  const v=document.getElementById('in-peso').value;
  if(!v){toast('Inserisci il peso ⚠️');return;}
  const now=new Date();
  const entry={id:now.getTime(),date:now.toISOString(),dateStr:now.toLocaleDateString('it-IT'),
    peso:parseFloat(v),note:document.getElementById('in-pesonote').value};
  const pesos=DB.get('pesos');pesos.push(entry);DB.set('pesos',pesos);
  document.getElementById('in-peso').value='';
  document.getElementById('in-pesonote').value='';
  toast(`${entry.peso} kg salvato ✓`);
  renderPesoList();
}

function renderPesoList(){
  const pesos=DB.get('pesos').reverse();
  const el=document.getElementById('peso-list');
  if(!pesos.length){
    el.innerHTML=`<div class="empty"><span class="empty-ico">⚖️</span><div class="empty-txt">Nessun peso.<br>Inizia lunedì mattina.</div></div>`;
    return;
  }
  el.innerHTML=pesos.map((p,i)=>{
    const next=pesos[i+1];
    const d=next?(p.peso-next.peso):null;
    const dStr=d!==null?(d>0?`+${d.toFixed(1)}`:d.toFixed(1)):'';
    const dCol=d===null?'':`color:${d<0?'var(--green)':d>0?'var(--red)':'var(--muted)'}`;
    return `<div class="peso-item">
      <div><div class="pi-date">${p.dateStr}</div><div class="pi-val">${p.peso} kg</div>${p.note?`<div class="pi-note">${p.note}</div>`:''}</div>
      <div style="display:flex;align-items:center;gap:12px">
        ${d!==null?`<div class="pi-delta" style="${dCol}">${dStr} kg</div>`:''}
        <button class="del-x" onclick="delPeso(${p.id})">×</button>
      </div>
    </div>`;
  }).join('');
}

function delPeso(id){
  DB.set('pesos',DB.get('pesos').filter(p=>p.id!==id));
  renderPesoList();toast('Eliminato');
}

/* ══ STATS ══ */
function renderStats(){
  const sessions=DB.get('sessions');
  const pesos=DB.get('pesos');
  const el=document.getElementById('stats-content');

  const total=sessions.length;
  const d1=sessions.filter(s=>s.day===1).length;
  const d2=sessions.filter(s=>s.day===2).length;
  const d3=sessions.filter(s=>s.day===3).length;
  const fins=sessions.filter(s=>s.finisher&&parseInt(s.finisher)>0).length;
  let pullMax=0,amrMax=0;
  sessions.forEach(s=>{
    (s.exercises?.['Pull-up presa prona']||[]).forEach(v=>{if(v&&v>pullMax)pullMax=v});
    const f=parseInt(s.finisher||0);if(f>amrMax)amrMax=f;
  });
  const pStart=pesos.length?pesos[0].peso:63;
  const pNow=pesos.length?pesos[pesos.length-1].peso:63;
  const dP=(pNow-pStart).toFixed(1);
  const target=62;
  const prog=pStart<=target?0:Math.max(0,Math.min(100,Math.round(((pStart-pNow)/(pStart-target))*100)));

  if(!total&&!pesos.length){
    el.innerHTML=`<div class="empty"><span class="empty-ico">📈</span><div class="empty-txt">Inizia ad allenarti<br>per vedere le statistiche.</div></div>`;
    return;
  }

  el.innerHTML=`
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-lbl">Sessioni</div><div class="stat-val" style="color:var(--accent)">${total}</div><div class="stat-sub">G1:${d1} G2:${d2} G3:${d3}</div></div>
    <div class="stat-card"><div class="stat-lbl">Finisher fatti</div><div class="stat-val" style="color:var(--accent)">${fins}</div><div class="stat-sub">su ${total} sess.</div></div>
    <div class="stat-card"><div class="stat-lbl">Pull-up max</div><div class="stat-val" style="color:var(--d1)">${pullMax||'—'}</div><div class="stat-sub">serie singola</div></div>
    <div class="stat-card"><div class="stat-lbl">AMRAP max</div><div class="stat-val" style="color:var(--gold)">${amrMax||'—'}</div><div class="stat-sub">round in 5 min</div></div>
  </div>
  <div class="prog-card">
    <div class="prog-row"><span>Inizio: ${pStart} kg</span><span>Obiettivo: ${target} kg</span></div>
    <div class="prog-bg"><div class="prog-fill" style="width:${prog}%"></div></div>
    <div class="prog-pct">${prog}%</div>
    <div class="prog-desc">Peso attuale: <strong style="color:var(--text)">${pNow} kg</strong> (${parseFloat(dP)>0?'+':''}${dP} dall'inizio)</div>
  </div>
  <div class="sec-title" style="margin-top:16px">Regole d'oro</div>
  ${RULES.map(r=>`<div class="rule-row">${r}</div>`).join('')}
  <div style="height:12px"></div>
  <button class="btn btn-ghost" onclick="exportData()" style="margin-bottom:8px">Esporta dati JSON</button>
  <button class="btn btn-danger" onclick="confirmReset()">Cancella tutti i dati</button>
  <div style="height:8px"></div>`;
}

function exportData(){
  const data={sessions:DB.get('sessions'),pesos:DB.get('pesos'),exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`carlo-fit-${new Date().toLocaleDateString('it-IT').replace(/\//g,'-')}.json`;
  a.click();URL.revokeObjectURL(url);
  toast('Dati esportati ✓');
}

function confirmReset(){
  if(!confirm('Cancellare TUTTI i dati? Non è reversibile.'))return;
  localStorage.removeItem('sessions');localStorage.removeItem('pesos');
  toast('Dati cancellati');renderStorico();renderPesoList();renderStats();
}

function delSession(id){
  if(!confirm('Eliminare questa sessione?'))return;
  DB.set('sessions',DB.get('sessions').filter(s=>s.id!==id));
  renderStorico();toast('Eliminata');
}

function updateBadge(){
  const sessions=DB.get('sessions');
  const b=document.getElementById('hdr-badge');
  if(sessions.length){b.textContent=`${sessions.length} sess.`;b.style.display='inline';}
}

/* ── INIT ── */
const days=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const months=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const now=new Date();
document.getElementById('hdr-date').textContent=
  `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;

renderScheda();
renderLog();
updateBadge();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
